name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NEXT_PUBLIC_SANITY_PROJECT_ID: wsj8a3ho
  NEXT_PUBLIC_SANITY_DATASET: production
  NEXT_PUBLIC_SANITY_API_VERSION: 2025-01-01
  NEXT_PUBLIC_SITE_URL: https://www.golfnext.de
  # Formular-Tests laufen mit Mock-Transport (kein SENDGRID_API_KEY) und einem Test-Secret
  FORM_SIGNING_SECRET: ci-only-signing-secret-not-for-production

jobs:
  gates:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
        env:
          SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      - name: Secret-Scan im Repo
        run: |
          # Echte API-Keys: SendGrid "SG.…", OpenAI/Anthropic "sk-…". Der Lockfile ist
          # ausgeschlossen (base64-Integrity-Hashes lösen sonst Fehlalarme aus).
          if git grep -nE "SG\.[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9_-]{40,}" -- ':!*.md' ':!pnpm-lock.yaml' ; then
            echo "Möglicher Schlüssel im Repository gefunden"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-build
          path: .next
          retention-days: 1

  e2e:
    name: Playwright · a11y · visuell
    runs-on: ubuntu-latest
    needs: gates
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Zwei Testbuilds statt eines Produktionsbuilds (Briefing 0029): Die Artikel-
      # Teaser auf `/` und `/ueber-golfnext` werden beim Bauen vorgerendert, der
      # Testbestand muss also schon beim Bauen wirken. `.next` = mit Artikeln,
      # `.next-leer` = ohne. Beide Builds fragen Sanity nicht an, sie brauchen deshalb
      # keinen Token. Der Produktionsbuild bleibt im Job "gates".
      - run: pnpm build:e2e
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
